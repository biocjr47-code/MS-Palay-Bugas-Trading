<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; touch-action: pan-y; cursor: grab; }
  canvas:active { cursor: grabbing; }
</style>
</head>
<body>
<script type="module">
// Stylized procedural bigas sack: woven polypropylene body, printed label band,
// twine tie at the gathered neck and a small mound of spilled grains.
// Built entirely from code (no image reference, no downloaded model) — shape is approximate.
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

const W = 1.3, H = 1.9, D = 0.66;
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

function rng(seed) { return () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646; }
const rand = rng(20261019);
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

// ---------- textures ----------
function weaveCanvas(w, h) {
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const g = c.getContext("2d");
  g.fillStyle = "#EEE7D4"; g.fillRect(0, 0, w, h);
  // flat polypropylene tape weave: alternating warp/weft tapes
  const tape = 6;
  for (let y = 0; y < h; y += tape) {
    for (let x = 0; x < w; x += tape) {
      const over = ((x / tape) + (y / tape)) % 2 === 0;
      g.fillStyle = over ? "rgba(255,255,255,0.35)" : "rgba(120,104,70,0.10)";
      g.fillRect(x, y, tape, tape);
    }
  }
  g.strokeStyle = "rgba(110,95,60,0.10)"; g.lineWidth = 1;
  for (let y = 0; y < h; y += tape) { g.beginPath(); g.moveTo(0, y + .5); g.lineTo(w, y + .5); g.stroke(); }
  return { c, g };
}

function labelTexture() {
  const { c, g } = weaveCanvas(512, 768);
  const cx = 256;
  // gold rules framing the green band
  g.fillStyle = "#B98320"; g.fillRect(0, 300, 512, 6); g.fillRect(0, 474, 512, 6);
  g.fillStyle = "#1F5E36"; g.fillRect(0, 312, 512, 156);
  // grain mark: three crisp ellipses
  g.fillStyle = "#1F5E36";
  [[-26, -14], [0, -22], [26, -14]].forEach(([dx, rot]) => {
    g.save(); g.translate(cx + dx, 236); g.rotate(rot * Math.PI / 180);
    g.beginPath(); g.ellipse(0, 0, 9, 22, 0, 0, Math.PI * 2); g.fill(); g.restore();
  });
  g.textAlign = "center"; g.textBaseline = "middle";
  g.fillStyle = "#1E2420"; g.font = "700 30px 'Hanken Grotesk', Arial, sans-serif"; g.fillText("M S", cx, 278);
  g.fillStyle = "#FBF8EF"; g.font = "800 66px 'Hanken Grotesk', Arial, sans-serif"; g.fillText("LAMI-ANG", cx, 360);
  g.font = "800 66px 'Hanken Grotesk', Arial, sans-serif"; g.fillText("BUGAS", cx, 424);
  g.fillStyle = "#1E2420"; g.font = "600 26px 'Hanken Grotesk', Arial, sans-serif";
  g.fillText("Well-milled rice", cx, 522);
  g.fillStyle = "#4A5048"; g.font = "500 22px 'Hanken Grotesk', Arial, sans-serif"; g.fillText("NET WT. 50 KG", cx, 556);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  return t;
}

function plainTexture() {
  const { c } = weaveCanvas(256, 512);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

function shadowTexture() {
  const c = document.createElement("canvas"); c.width = c.height = 128;
  const g = c.getContext("2d");
  const grd = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grd.addColorStop(0, "rgba(60,48,25,0.38)"); grd.addColorStop(1, "rgba(60,48,25,0)");
  g.fillStyle = grd; g.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
}

// ---------- geometry ----------
function sackGeometry() {
  const geo = new THREE.BoxGeometry(W, H, D, 30, 44, 14);
  const p = geo.attributes.position, v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i);
    const nx = v.x / (W / 2), ny = v.y / (H / 2);
    // pillow: seams flat, belly full
    const puff = Math.sqrt(Math.max(0, 1 - nx ** 4)) * Math.pow(Math.max(0, 1 - Math.abs(ny) ** 5), 0.35);
    v.z = Math.sign(v.z || 1e-6) * (D / 2) * (0.18 + 0.82 * puff) * (Math.abs(v.z) / (D / 2));
    // settled grain: bottom bulges out, shoulders slump
    v.x *= 1 + 0.07 * smooth(0.2, -1, ny);
    v.z *= 1 + 0.12 * smooth(0.3, -0.9, ny);
    // gathered neck under the tie
    const neck = smooth(0.6, 0.9, ny);
    v.x *= 1 - 0.68 * neck; v.z *= 1 - 0.7 * neck;
    const flare = smooth(0.9, 1, ny);            // fabric fans out above the tie
    v.x *= 1 + 0.9 * flare; v.z *= 1 + 0.5 * flare;
    // cloth wrinkles toward the neck, fixed seed
    const wr = 0.018 * neck * Math.sin(nx * 22 + ny * 5) + 0.006 * Math.sin(nx * 9 + ny * 13) * Math.cos(ny * 7);
    v.z += Math.sign(v.z) * wr;
    v.y -= 0.05 * (nx * nx) * smooth(-0.5, -1, ny); // rounded bottom corners
    p.setXYZ(i, v.x, v.y, v.z);
  }
  geo.computeVertexNormals();
  return geo;
}

// ---------- scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(28, 1, 0.1, 50);
camera.position.set(0, 0.55, 6.4);
camera.lookAt(0, -0.1, 0);

scene.add(new THREE.HemisphereLight(0xfff6e2, 0xc6bb9f, 1.15));
const key = new THREE.DirectionalLight(0xffe7c2, 2.4); key.position.set(3, 4, 5); scene.add(key);
const rim = new THREE.DirectionalLight(0xdfe9ff, 0.6); rim.position.set(-4, 2, -3); scene.add(rim);

await document.fonts.load("800 66px \"Hanken Grotesk\"").catch(() => {});

const sack = new THREE.Group();
const weave = new THREE.MeshStandardMaterial({ map: plainTexture(), roughness: 0.78, metalness: 0 });
const front = new THREE.MeshStandardMaterial({ map: labelTexture(), roughness: 0.72, metalness: 0 });
// BoxGeometry groups: +x, -x, +y, -y, +z, -z
const body = new THREE.Mesh(sackGeometry(), [weave, weave, weave, weave, front, front]);
sack.add(body);

const tie = new THREE.Mesh(
  new THREE.TorusGeometry(0.235, 0.032, 10, 40),
  new THREE.MeshStandardMaterial({ color: 0xa8864f, roughness: 0.9 })
);
tie.rotation.x = Math.PI / 2; tie.scale.set(1, 0.52, 1); tie.position.y = H / 2 * 0.86;
sack.add(tie);
const knot = new THREE.Mesh(new THREE.SphereGeometry(0.05, 12, 10), tie.material);
knot.position.set(0.19, H / 2 * 0.86, 0.1); sack.add(knot);

// spilled grains
const GRAINS = 240;
const grainGeo = new THREE.SphereGeometry(0.028, 8, 6); grainGeo.scale(1, 0.42, 0.42);
const grains = new THREE.InstancedMesh(grainGeo, new THREE.MeshStandardMaterial({ color: 0xf5f1e4, roughness: 0.42 }), GRAINS);
const m = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), s = new THREE.Vector3(1, 1, 1), pos = new THREE.Vector3();
const floorY = -H / 2 - 0.02;
for (let i = 0; i < GRAINS; i++) {
  const r = Math.pow(rand(), 0.8) * 0.5, a = rand() * Math.PI * 2;
  const mound = 0.13 * Math.max(0, 1 - (r / 0.5) ** 1.6);
  pos.set(0.78 + Math.cos(a) * r * 1.15, floorY + 0.012 + rand() * mound, 0.42 + Math.sin(a) * r * 0.7);
  e.set(rand() * Math.PI, rand() * Math.PI, rand() * Math.PI); q.setFromEuler(e);
  m.compose(pos, q, s); grains.setMatrixAt(i, m);
}
scene.add(grains);

const shadow = new THREE.Mesh(
  new THREE.PlaneGeometry(3.2, 1.6),
  new THREE.MeshBasicMaterial({ map: shadowTexture(), transparent: true, depthWrite: false })
);
shadow.rotation.x = -Math.PI / 2; shadow.position.set(0.15, floorY, 0.1);
scene.add(shadow);
scene.add(sack);
sack.rotation.y = -0.32;

// ---------- interaction & loop ----------
let dragX = null, offset = 0, target = 0, visible = true;
const el = renderer.domElement;
el.addEventListener("pointerdown", (ev) => { dragX = ev.clientX; el.setPointerCapture(ev.pointerId); });
el.addEventListener("pointermove", (ev) => { if (dragX !== null) { target += (ev.clientX - dragX) * 0.012; dragX = ev.clientX; } });
el.addEventListener("pointerup", () => { dragX = null; });
el.addEventListener("pointercancel", () => { dragX = null; });

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.position.z = w / h < 1 ? 7.6 : 6.4;
  camera.updateProjectionMatrix();
}
addEventListener("resize", resize); resize();
new IntersectionObserver(([en]) => { visible = en.isIntersecting; }).observe(el);
document.addEventListener("visibilitychange", () => { visible = !document.hidden; });

const clock = new THREE.Clock();
function frame() {
  requestAnimationFrame(frame);
  if (!visible) return;
  const t = clock.getElapsedTime();
  offset += (target - offset) * 0.08;
  const sway = reduceMotion ? 0 : Math.sin(t * 0.45) * 0.38;
  sack.rotation.y = -0.32 + sway + offset;
  renderer.render(scene, camera);
}
frame();
</script>
</body>
</html>
